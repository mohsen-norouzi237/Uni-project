name: backend CI
on: [push, pull_request]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: ruff check .
  migrate-check:
    needs: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
        env: {SECRET_KEY: dummy-ci, ALLOWED_HOSTS: localhost, DATABASE_URL: "sqlite:///db.sqlite3"}
  pytest:
    needs: migrate-check
    runs-on: ubuntu-latest
    services:
      postgres: {image: postgres:16, env: {POSTGRES_DB: tams, POSTGRES_USER: tams, POSTGRES_PASSWORD: tams}, ports: ["5432:5432"]}
      redis: {image: redis:7, ports: ["6379:6379"]}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: pytest -q
        env: {SECRET_KEY: dummy-ci, ALLOWED_HOSTS: localhost, DATABASE_URL: postgres://tams:tams@localhost:5432/tams, REDIS_URL: redis://localhost:6379/0}
  schema-check:
    needs: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python manage.py spectacular --file /tmp/schema.yml --fail-on-warn
        env: {SECRET_KEY: dummy-ci, ALLOWED_HOSTS: localhost, DATABASE_URL: "sqlite:///db.sqlite3"}

  # P3 fix: the SPA previously had zero CI coverage — TS type errors, lint
  # violations and broken builds merged silently. Runs on every push/PR.
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
