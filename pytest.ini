[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = test*.py

# P3 fix: tests no longer require a live Redis container.
# config/settings/base.py reads REDIS_URL and treats the sentinel value
# "locmem" as "use Django's LocMemCache instead of RedisCache".
# Run locally without Redis via:  REDIS_URL=locmem pytest -q
# (CI keeps a real redis service to exercise the production cache path.)
